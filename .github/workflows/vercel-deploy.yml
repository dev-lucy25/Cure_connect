name: Vercel 배포

# Vercel 무료 플랜 + 비공개 저장소에서는 저장소 주인(dev-lucy25)이 아닌 사람의 커밋을 Vercel이 막는다.
# 그래서 다른 사람이 main에 올리면 주인의 Vercel 토큰으로 대신 배포한다.
# 주인이 올린 커밋은 Vercel이 원래대로 직접 배포하므로 여기서는 건너뛴다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'dev-lucy25'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # git 정보를 빼야 Vercel이 커밋 작성자 검사 없이 토큰 주인의 배포로 받는다
      - run: rm -rf .git
      - run: npx --yes vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
